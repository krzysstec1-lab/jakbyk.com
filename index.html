<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="JAKBYK — strona w przygotowaniu. Wkrótce więcej.">
    <meta name="theme-color" content="#000000">
    <title>JAKBYK — wkrótce</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f3efe9;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: 100%;
        padding: 20px 24px;
        text-align: center;
      }
      img {
        display: block;
        width: min(100%, 320px, 55vh);
        width: min(100%, 320px, 55svh);
        height: auto;
        margin: 0 auto 20px;
      }
      h1 {
        margin: 0 0 12px;
        color: #c79b51;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        color: #aaa6a0;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="jakbyk.jpg" alt="JAKBYK — logo z głową byka" width="1254" height="1254">
      <h1>Strona w przygotowaniu</h1>
      <p>Wkrótce więcej. Do zobaczenia!</p>
    </main>
  </body>
</html>
